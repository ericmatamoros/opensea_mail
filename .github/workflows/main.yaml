name: Price alerts

on:
  schedule:
    # GitHub cron schedules use UTC.
    - cron: "0 5 * * 1,3"
    - cron: "0 5 * * 6"
  workflow_dispatch:
    inputs:
      report:
        description: Send the complete weekly report
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: price-alerts
  cancel-in-progress: true

jobs:
  run-python:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check prices
        env:
          OPENSEA_KEY: ${{ secrets.OPENSEA_KEY }}
          COINMARKETCAP_KEY: ${{ secrets.COINMARKETCAP_KEY }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          REPORT_MODE: ${{ github.event.schedule == '0 5 * * 6' || inputs.report }}
        run: |
          if [[ "$REPORT_MODE" == "true" ]]; then
            python -m opensea_mail.scripts.pipeline --report
          else
            python -m opensea_mail.scripts.pipeline
          fi

  notify-on-failure:
    name: Email failure notification
    needs: run-python
    if: ${{ always() && needs.run-python.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Send failure email
        env:
          RUN_RESULT: ${{ needs.run-python.result }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          required = ("SENDER_EMAIL", "RECEIVER_EMAIL", "SENDER_PASSWORD")
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              raise RuntimeError(
                  f"Cannot send failure notification; missing: {', '.join(missing)}"
              )

          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}"
          )
          message = EmailMessage()
          message["From"] = os.environ["SENDER_EMAIL"]
          message["To"] = os.environ["RECEIVER_EMAIL"]
          message["Subject"] = "[opensea_mail] Price monitor failed"
          message.set_content(
              "The price-monitoring job failed, was cancelled, or exceeded its "
              "five-minute limit.\n\n"
              f"Result: {os.environ['RUN_RESULT']}\n"
              f"Repository: {os.environ['GITHUB_REPOSITORY']}\n"
              f"Workflow: {os.environ['GITHUB_WORKFLOW']}\n"
              f"Commit: {os.environ['GITHUB_SHA']}\n"
              f"Run details: {run_url}\n"
          )

          context = ssl.create_default_context()
          with smtplib.SMTP("smtp.gmail.com", 587, timeout=20) as server:
              server.starttls(context=context)
              server.login(
                  os.environ["SENDER_EMAIL"], os.environ["SENDER_PASSWORD"]
              )
              server.send_message(message)
          PY
